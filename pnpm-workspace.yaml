packages:
  - apps/*
  - oxlint-plugin-app
  - packages/*
  - scripts

allowBuilds:
  electron: true
  electron-winstaller: true
  msgpackr-extract: true

overrides:
  "@effect/platform-node-shared": "catalog:"
  # Deduplicate electron-builder's transitive toml parser onto one version.
  toml: 4.1.1

peerDependencyRules:
  ignoreMissing:
    # Optional electron-builder target we don't build (NSIS is used on Windows).
    - electron-builder-squirrel-windows
    # Optional Redis peer of @effect/platform-node-shared; unused here.
    - ioredis

catalog:
  "@effect/atom-react": 4.0.0-beta.106
  "@effect/platform-node": 4.0.0-beta.106
  "@effect/platform-node-shared": 4.0.0-beta.106
  "@effect/vitest": 4.0.0-beta.106
  "@oxlint/plugins": ^1.77.0
  "@types/node": 24.12.4
  effect: 4.0.0-beta.106
  oxfmt: ^0.62.0
  oxlint: ^1.77.0
  typescript: ~7.0.2
  vite: ^8.2.1
  vitest: ^4.1.10
