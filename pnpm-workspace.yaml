packages:
  - apps/*
  - oxlint-plugin-app
  - packages/*
  - scripts

allowBuilds:
  electron: true
  electron-winstaller: true
  msgpackr-extract: true

overrides:
  "@effect/platform-node-shared": "catalog:"
  # Deduplicate electron-builder's transitive toml parser onto one version.
  toml: 4.1.1

peerDependencyRules:
  ignoreMissing:
    # Optional electron-builder target we don't build (NSIS is used on Windows).
    - electron-builder-squirrel-windows
    # Optional Redis peer of @effect/platform-node-shared; unused here.
    - ioredis

catalog:
  "@anthropic-ai/claude-agent-sdk": 0.3.218
  "@anthropic-ai/sdk": 0.114.0
  "@effect/atom-react": 4.0.0-beta.99
  "@effect/platform-node": 4.0.0-beta.99
  "@effect/platform-node-shared": 4.0.0-beta.99
  "@effect/sql-sqlite-node": 4.0.0-beta.99
  "@effect/vitest": 4.0.0-beta.99
  "@modelcontextprotocol/sdk": 1.29.0
  "@openai/codex": 0.145.0
  "@openai/codex-sdk": 0.145.0
  "@oxlint/plugins": ^1.72.0
  "@pierre/diffs": 1.2.12
  "@pierre/trees": 1.0.0-beta.5
  "@tanstack/react-router": 1.170.18
  "@types/node": 24.12.4
  effect: 4.0.0-beta.99
  oxfmt: ^0.57.0
  oxlint: ^1.72.0
  react-markdown: 10.1.0
  remark-gfm: 4.0.1
  typescript: ~6.0.3
  vite: ^8.1.3
  vitest: ^4.1.9
  zod: 4.4.3

minimumReleaseAgeExclude:
  - "@effect/atom-react@4.0.0-beta.99"
  - "@effect/platform-node-shared@4.0.0-beta.99"
  - "@effect/platform-node@4.0.0-beta.99"
  - "@effect/sql-sqlite-node@4.0.0-beta.99"
  - "@effect/vitest@4.0.0-beta.99"
  - "effect@4.0.0-beta.99"
  - "@anthropic-ai/sdk@0.114.0"
