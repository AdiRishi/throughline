packages:
  - apps/*
  - oxlint-plugin-app
  - packages/*
  - scripts

allowBuilds:
  electron: true
  electron-winstaller: false
  msgpackr-extract: true

overrides:
  "@effect/platform-node-shared": "catalog:"
  # Deduplicate electron-builder's transitive toml parser onto one version.
  toml: 4.1.1

peerDependencyRules:
  ignoreMissing:
    # Optional electron-builder target we don't build (NSIS is used on Windows).
    - electron-builder-squirrel-windows
    # Optional Redis peer of @effect/platform-node-shared; unused here.
    - ioredis

catalog:
  "@effect/atom-react": 4.0.0-beta.106
  "@effect/language-service": ^0.87.2
  "@effect/platform-node": 4.0.0-beta.106
  "@effect/platform-node-shared": 4.0.0-beta.106
  "@effect/tsgo": ^0.36.2
  "@effect/vitest": 4.0.0-beta.106
  "@oxlint/plugins": ^1.77.0
  "@types/node": 24.12.4
  effect: 4.0.0-beta.106
  oxfmt: ^0.62.0
  oxlint: ^1.77.0
  typescript: ~7.0.2
  vite: ^8.2.1
  vitest: ^4.1.10

minimumReleaseAgeExclude:
  - "@effect/tsgo-darwin-arm64@0.36.2"
  - "@effect/tsgo-darwin-x64@0.36.2"
  - "@effect/tsgo-linux-arm64@0.36.2"
  - "@effect/tsgo-linux-arm@0.36.2"
  - "@effect/tsgo-linux-x64@0.36.2"
  - "@effect/tsgo-win32-arm64@0.36.2"
  - "@effect/tsgo-win32-x64@0.36.2"
  - "@effect/tsgo@0.36.2"

patchedDependencies:
  # RpcClient's pinger fails the socket on the FIRST missed pong inside its 5s
  # window. One stalled event loop — an Electron main-thread hitch, a GC pause,
  # a slow OTLP flush — is enough, and the whole session then tears down and
  # reconnects. The patch tolerates three consecutive misses before opening the
  # timeout latch. Re-apply this on every `effect` bump: `pnpm patch effect@<v>`,
  # port the `makePinger` hunk, `pnpm patch-commit`.
  effect@4.0.0-beta.106: patches/effect@4.0.0-beta.106.patch
