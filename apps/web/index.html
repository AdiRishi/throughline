<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ebe9e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Pre-mount theme guard: toggle `.dark` before React renders so there is
      // no flash of the wrong theme. Mirrors the logic in hooks/useTheme.ts.
      (() => {
        try {
          const stored =
            window.desktopBridge?.getTheme() ?? window.localStorage.getItem("app:theme");
          const theme =
            stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
        } catch {
          // Storage unavailable: fall back to the system preference, matching
          // useTheme's default. Force dark only if even matchMedia fails.
          try {
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.classList.toggle("dark", prefersDark);
          } catch {
            document.documentElement.classList.add("dark");
          }
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        background: #f1f0ec;
        color: #202329;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      html.dark body {
        background: #0f1116;
        color: #e8ebf0;
      }
      #boot-splash {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
      }
      #boot-splash-dot {
        width: 24px;
        height: 3px;
        border-radius: 1px;
        background: #e2a44e;
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
    <title>Throughline</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" aria-label="Loading">
        <div id="boot-splash-dot"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
